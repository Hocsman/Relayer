# The desktop application's sentinel errors carry the sentence shown to the
# operator: they are returned across the Wails bridge and rendered verbatim in
# the interface, so they are capitalised and punctuated like the UI text they
# are. ST1005 assumes an error string is a fragment that gets wrapped and
# concatenated, which is not what these are.
#
# Separating the displayed message from the error value would be the cleaner
# design and is worth doing; silencing the check here is what makes every other
# staticcheck rule enforceable on this module in the meantime, rather than none.
checks = ["all", "-ST1005"]
