name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify downloaded modules
        run: go mod verify

      - name: Verify module files are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.1"
          install-go: false

      - name: Install govulncheck
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/relayer-tools"
          GOBIN="$RUNNER_TEMP/relayer-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies for known vulnerabilities
        run: $RUNNER_TEMP/relayer-tools/govulncheck ./...

      - name: Test with coverage
        shell: bash
        run: |
          private_tmux_dir="$(mktemp -d "$RUNNER_TEMP/relayer-quality-tmux.XXXXXX")"
          chmod 700 "$private_tmux_dir"
          export TMUX_TMPDIR="$private_tmux_dir"
          unset TMUX TMUX_PANE

          cleanup_tmux() {
            if command -v tmux >/dev/null 2>&1; then
              tmux kill-server >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_tmux EXIT

          go test -count=1 -timeout=5m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

      # `check` only validates the schema. Building the archives here means the
      # first real run of the release pipeline is not the publishing one.
      # Signing and SBOM generation need cosign and syft, which belong to the
      # release job, so they are skipped.
      - name: Build release archives without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Verify the expected archives were produced
        shell: bash
        run: |
          missing=0
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            if ! ls dist/relayer_*_"$target".tar.gz >/dev/null 2>&1; then
              printf 'missing archive for %s\n' "$target" >&2
              missing=1
            fi
          done
          if ! ls dist/relayer_*_checksums.txt >/dev/null 2>&1; then
            printf 'missing checksum file\n' >&2
            missing=1
          fi
          exit "$missing"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify downloaded modules
        run: go mod verify

      - name: Test
        shell: bash
        run: |
          private_tmux_dir="$(mktemp -d "$RUNNER_TEMP/relayer-test-tmux.XXXXXX")"
          chmod 700 "$private_tmux_dir"
          export TMUX_TMPDIR="$private_tmux_dir"
          unset TMUX TMUX_PANE

          cleanup_tmux() {
            if command -v tmux >/dev/null 2>&1; then
              tmux kill-server >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_tmux EXIT

          go test -count=1 -timeout=5m ./...

      - name: Test with the race detector
        shell: bash
        run: |
          private_tmux_dir="$(mktemp -d "$RUNNER_TEMP/relayer-race-tmux.XXXXXX")"
          chmod 700 "$private_tmux_dir"
          export TMUX_TMPDIR="$private_tmux_dir"
          unset TMUX TMUX_PANE

          cleanup_tmux() {
            if command -v tmux >/dev/null 2>&1; then
              tmux kill-server >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_tmux EXIT

          go test -race -count=1 -timeout=5m ./...

      - name: Build all commands
        run: go build -trimpath -buildvcs=false ./...

  windows-config:
    name: Windows configuration locking
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Test native Windows configuration locking
        run: go test -count=1 -timeout=2m ./internal/config

      - name: Vet Windows configuration code
        run: go vet ./internal/config

  tmux-integration:
    name: tmux integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Download modules
        run: go mod download

      # This job installs tmux, so a test that cannot find it has hit a broken
      # installation rather than an absent capability. RELAYER_REQUIRE_TMUX
      # turns that into a failure instead of a skip, which would otherwise be
      # reported as a green run that exercised nothing.
      #
      # internal/fixturecapture is included because its tmux tests are the ones
      # that were silently skipping while the backend was unusable.
      - name: Run tmux integration tests in an isolated server
        shell: bash
        env:
          RELAYER_REQUIRE_TMUX: "1"
        run: |
          private_tmux_dir="$(mktemp -d "$RUNNER_TEMP/relayer-tmux.XXXXXX")"
          chmod 700 "$private_tmux_dir"
          export TMUX_TMPDIR="$private_tmux_dir"
          unset TMUX TMUX_PANE

          cleanup_tmux() {
            tmux kill-server >/dev/null 2>&1 || true
          }
          trap cleanup_tmux EXIT

          tmux -V
          go test -race -count=1 -timeout=5m \
            -run '^TestTmux' \
            ./internal/tmuxbackend
          go test -race -count=1 -timeout=5m ./internal/fixturecapture
