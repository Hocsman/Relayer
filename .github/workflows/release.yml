name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Validate semantic version tag
        id: semver
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$tag" =~ $semver_re ]]; then
            printf 'Invalid release tag: %s\nExpected vMAJOR.MINOR.PATCH with optional SemVer prerelease/build metadata.\n' "$tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Test, including isolated tmux integration
        shell: bash
        run: |
          private_tmux_dir="$(mktemp -d "$RUNNER_TEMP/relayer-release-tmux.XXXXXX")"
          chmod 700 "$private_tmux_dir"
          export TMUX_TMPDIR="$private_tmux_dir"
          unset TMUX TMUX_PANE

          cleanup_tmux() {
            tmux kill-server >/dev/null 2>&1 || true
          }
          trap cleanup_tmux EXIT

          tmux -V
          go test -race -count=1 -timeout=5m ./...

      - name: Validate injected version metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/Hocsman/Relayer/internal/version.Version=$version -X github.com/Hocsman/Relayer/internal/version.Commit=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/relayer" ./cmd/relayer
          actual="$("$RUNNER_TEMP/relayer" --version)"
          expected="relayer $version (commit $GITHUB_SHA)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected version output: %s\n' "$actual" >&2
            exit 1
          fi

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless signing binds this workflow's OIDC identity into a short-lived
      # certificate; provenance attestation uses the same identity.
      id-token: write
      attestations: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # GoReleaser is installed before cosign on purpose. The action verifies
      # its own download with whatever cosign it finds on PATH, and the cosign
      # we install for signing cannot read the bundle format that verification
      # uses: it fails with "bundle does not contain cert for verification".
      # Installing GoReleaser first keeps its self-check on its own tooling.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Build and publish release artifacts
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Independent of the cosign signature: this records who built the
      # archives and from which commit, verifiable with the gh CLI.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt

  build-desktop:
    name: Build desktop (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            archive: relayer-desktop_${{ needs.verify.outputs.version }}_windows_amd64.zip
            cgo: "0"
          - name: macOS
            os: macos-15
            archive: relayer-desktop_${{ needs.verify.outputs.version }}_darwin_universal.zip
            cgo: "1"
          - name: Linux
            os: ubuntu-24.04
            archive: relayer-desktop_${{ needs.verify.outputs.version }}_linux_amd64.tar.gz
            cgo: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/relayer-gui/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/relayer-gui/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/relayer-gui/frontend/package-lock.json

      - name: Install native Wails dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install pinned Wails CLI
        run: |
          mkdir -p "$RUNNER_TEMP/relayer-wails-bin"
          GOBIN="$RUNNER_TEMP/relayer-wails-bin" \
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          wails_bin="$RUNNER_TEMP/relayer-wails-bin/wails"
          [[ -f "$wails_bin.exe" ]] && wails_bin="$wails_bin.exe"
          version_output="$("$wails_bin" version)"
          test "${version_output%%$'\n'*}" = "v2.14.0"

      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: cmd/relayer-gui/frontend

      - name: Build native GUI
        working-directory: cmd/relayer-gui
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          wails_bin="$RUNNER_TEMP/relayer-wails-bin/wails"
          [[ -f "$wails_bin.exe" ]] && wails_bin="$wails_bin.exe"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            "$wails_bin" build -clean -tags webkit2_41 -o Relayer
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            "$wails_bin" build -clean -o Relayer.exe
          else
            "$wails_bin" build -clean -platform darwin/universal
          fi

      - name: Package desktop distribution archive
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          archive_path="$RUNNER_TEMP/dist/${{ matrix.archive }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p "$RUNNER_TEMP/pkg"
            cp cmd/relayer-gui/build/bin/Relayer.exe "$RUNNER_TEMP/pkg/"
            cp README.md LICENSE "$RUNNER_TEMP/pkg/"
            (cd "$RUNNER_TEMP/pkg" && 7z a "$archive_path" *)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mkdir -p "$RUNNER_TEMP/pkg"
            cp -R cmd/relayer-gui/build/bin/Relayer.app "$RUNNER_TEMP/pkg/"
            cp README.md LICENSE "$RUNNER_TEMP/pkg/"
            (cd "$RUNNER_TEMP/pkg" && zip -r -y "$archive_path" *)
          else
            mkdir -p "$RUNNER_TEMP/pkg/relayer-desktop"
            cp cmd/relayer-gui/build/bin/Relayer "$RUNNER_TEMP/pkg/relayer-desktop/"
            cp README.md LICENSE "$RUNNER_TEMP/pkg/relayer-desktop/"
            (cd "$RUNNER_TEMP/pkg" && tar -czvf "$archive_path" relayer-desktop)
          fi

      - name: Upload desktop package artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop release artifacts
    needs: [verify, publish, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-desktop/
          merge-multiple: true

      - name: Generate desktop checksums
        shell: bash
        run: |
          cd release-desktop
          sha256sum relayer-desktop_* > "relayer-desktop_${{ needs.verify.outputs.version }}_checksums.txt"
          cat "relayer-desktop_${{ needs.verify.outputs.version }}_checksums.txt"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign desktop checksums
        shell: bash
        run: |
          cd release-desktop
          checksums_file="relayer-desktop_${{ needs.verify.outputs.version }}_checksums.txt"
          cosign sign-blob \
            --output-signature="${checksums_file}.sig" \
            --output-certificate="${checksums_file}.pem" \
            --yes \
            "$checksums_file"

      - name: Upload desktop assets to GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release upload "$tag" release-desktop/* --clobber

      - name: Attest desktop build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-desktop/*.zip
            release-desktop/*.tar.gz
            release-desktop/*_checksums.txt
