# Relayer configuration; agents: [] enables both mocks.
version: 1
backend: pty
sessions:
  persist_on_exit: false
  cleanup_on_success: true
policies:
  default_action: ask
  dry_run: false
  # max_consecutive_auto_decisions: 5 # Force human review after N consecutive automatic decisions
  # rate_limit_per_minute: 10         # Maximum automatic decisions allowed per minute
  # guardrails:
  #   block_destructive: true         # Intercept destructive file deletions & formatting (rm -rf, mkfs, etc.)
  #   block_exfiltration: true        # Intercept piped shell execution & secret reading (curl | bash, .ssh, .env)
  #   blocked_patterns: []            # Optional custom regex patterns to intercept and force human review
  rules: []
audit:
  enabled: true
  mode: metadata
  path: ""
  max_file_size_mb: 10
  max_files: 5
agents: []
intercept_patterns:
  - pattern: '(?i)overwrite.*\[y/n\]'
    description: "overwrite confirmation"
  - pattern: '(?i)\[[yn]/[yn]\]'
    description: "yes/no confirmation"
  - pattern: '(?im)password:[[:space:]]*$'
    description: "password entry"
  - pattern: '(?i)do you want to continue'
    description: "continue confirmation"
